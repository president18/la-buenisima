      <button class="btn" id="refreshBtn" style="padding:5px 9px" title="Actualizar" aria-label="Actualizar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button></div>

  <section class="sec" id="s-roast"></section>
  <section class="sec" id="s-h2h"></section>
  <section class="sec" id="s-calendarios"></section>
  <section class="sec" id="s-movimientos"></section>
  <section class="sec" id="s-draft"></section>
  <section class="sec" id="s-oscars"></section>
  <section class="sec" id="s-historia"></section>
</main>

<div class="article" id="article"></div>
<nav class="bnav" id="bnav"></nav>
<div class="sheet" id="sheet" onclick="if(event.target===this)this.classList.remove('on')"><div class="sheet-in" id="sheetIn"></div></div>
<div class="modal" id="imgModal" onclick="if(event.target===this)this.classList.remove('on')"><div class="modal-in"><div class="modal-body"></div></div></div>
<div class="toast" id="toast"></div>
<div id="canvasHost"></div>
