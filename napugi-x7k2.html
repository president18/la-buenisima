<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mi equipo · La Buenísima</title>
<meta name="theme-color" content="#0B0F17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div id="brandLogo" class="logo">LB</div>
    <div class="brand"><h1>Mi equipo</h1><small>Privado · La Buenísima</small></div>
    <div class="live"><span id="liveTxt">🔒</span><button class="btn" id="refreshBtn" style="padding:5px 9px" title="Actualizar">↻</button></div>
  </div>
</header>
<div id="gate" class="loading"><div class="card" style="max-width:320px;width:100%">
  <div class="h3" style="margin-top:0">🔒 Página privada</div>
  <p class="small muted">Escribe tu PIN.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:18px;letter-spacing:4px;text-align:center">
  <p id="pinErr" class="small bad" style="display:none">PIN incorrecto</p>
  <button class="btn pri" id="pinBtn" style="width:100%;justify-content:center;margin-top:10px">Entrar</button>
</div></div>
<div id="loading" class="loading" style="display:none"><div><div class="spin"></div><div id="loadTxt">Conectando con Sleeper…</div></div></div>
<main id="main" class="wrap" style="display:none"></main>
<div class="toast" id="toast"></div>
<div id="canvasHost"></div>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/team.js"></script>
</body>
</html>
